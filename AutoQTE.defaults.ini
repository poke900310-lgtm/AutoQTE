; AutoQTE - shipped defaults, for reference.
;
; DO NOT EDIT THIS FILE. A mod update replaces it.
; To change a setting, copy this file to AutoQTE.ini in the same folder and
; edit that. AutoQTE.ini is yours: it is never shipped and never overwritten.
; If neither file is present the values below are used anyway.
;
; Settings are read once, when the game starts. Restart after editing.

; Master switch. The toggle key flips this in game, in either direction, and
; mid-scene: turn it off and the live prompt comes back for you to play, turn
; it on and the next prompt in that same scene is resolved.
Enabled = true

; Fade the prompt ring out while a scene is being skipped, then put it back.
; Purely cosmetic - the prompt is resolved either way.
; Set this to false if you run a HUD mod that also manages the DIS prompt
; widget (HUDTweaks - Fixes lists it in its own fade watch list), or if you
; would rather see the prompt appear.
HidePrompt = true

; Keys, by UE4SS key name: "F4", "INS", "HOME", "NUM_FIVE" and so on.
; Leave a value empty to bind nothing. Modifier combinations are not supported.
; AutoQTE never takes a key another mod registered first - it says so in the
; log and leaves the bind alone.
ToggleKey = F4
DiagnoseKey = F5

; Scenes to leave to the player, comma separated. Empty by default.
;
; This is a matter of TASTE. Auto-completing a prompt is not a story decision:
; AutoQTE only ever calls the scene's own CompleteCurrentPrompt, which sets the
; end type to Completed - exactly what the game records when you press the
; button yourself. It cannot produce any other outcome. Quest logic does treat
; a completed scene differently from a cancelled one, but AutoQTE can only ever
; reach the completed side, and BP_DIS_C never writes CancelledByPlayer at all.
; The practical difference is that less in-game time passes.
;
; Patterns are lowercase substrings, matched against the scene actor's full name
; joined with its level sequence's full name. Press the diagnose key during a
; scene and read the "scene:" line in the log, then use a distinctive fragment
; of the level-sequence half (the actor half is a per-instance GUID).
;
; A ready-made cautious set, if you would rather perform the game's more
; pointed scenes yourself. Uncomment the single BlockAlso line below to use it,
; or trim it to taste. It MUST stay on ONE line: this parser reads one key per
; line, and a wrapped value would apply only its first line.
;
;   vasylflogging     hitting Vasyl            feedingesme       feeding Esme
;   forcefeed         a bowl of poison         anca_wounds       treating Anca
;   patching_marat    treating Marat           endurance_trial   a blood ritual
;   breakritual       breaking the basin       eating_mandrake   a blood bite
;   takerabbit        a rabbit in a trap       destroying_skates wrecking skates
;   filling_grave     a burial                 ringingbells      ringing the bells
;   gettingkey        taking a key
;
; BlockAlso = vasylflogging, feedingesme, forcefeed, anca_wounds, patching_marat, endurance_trial, breakritual, eating_mandrake, takerabbit, destroying_skates, filling_grave, ringingbells, gettingkey
BlockAlso =

; Also write the mod's log lines to AutoQTE.log beside main.lua. With this off
; the same lines still reach the UE4SS console and UE4SS.log.
Verbose = false

; One line per individual prompt, plus the trigger state each time. Noisy;
; useful when diagnosing a single scene that misbehaves.
LogEveryCompletion = false
